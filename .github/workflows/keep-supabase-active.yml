name: Keep Supabase Active

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Ping Supabase database
        run: |
          set -euo pipefail

          if [ -z "${PROJECT_REF:-}" ]; then
            echo "SUPABASE_PROJECT_REF repository variable is missing."
            exit 1
          fi

          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "SUPABASE_ANON_KEY repository secret is missing."
            exit 1
          fi

          HTTP_STATUS="$(
            curl --silent --show-error --output /tmp/supabase-response.json \
              --write-out "%{http_code}" \
              --fail-with-body \
              --request GET \
              "https://${PROJECT_REF}.supabase.co/rest/v1/listings?select=id&limit=1" \
              --header "apikey: ${SUPABASE_ANON_KEY}" \
              --header "Authorization: Bearer ${SUPABASE_ANON_KEY}"
          )"

          echo "Supabase responded with HTTP ${HTTP_STATUS}"
          echo "Keep-alive ping completed successfully."
