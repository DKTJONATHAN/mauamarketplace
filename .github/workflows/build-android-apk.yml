name: Build Maua Marketplace APK

on:
  push:
    paths:
      - "android/twa-manifest.json"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli
      - name: Configure Bubblewrap
        run: bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_SDK_ROOT"
      - name: Prepare signing key
        working-directory: android
        run: |
          keytool -genkeypair -v -keystore android.keystore -storepass "maua-marketplace-build" -keypass "maua-marketplace-build" -alias "maua-marketplace" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Maua Marketplace, OU=Maua Marketplace, O=Maua Marketplace, L=Maua, ST=Meru, C=KE"
      - name: Generate Android project
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade --manifest="./twa-manifest.json"
      - name: Build signed APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: "maua-marketplace-build"
          BUBBLEWRAP_KEY_PASSWORD: "maua-marketplace-build"
        run: bubblewrap build --skipPwaValidation --manifest="./twa-manifest.json" --signingKeyPath="./android.keystore" --signingKeyAlias="maua-marketplace"
      - name: Rename APK
        working-directory: android
        run: cp app-release-signed.apk ../Maua-Marketplace.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Maua-Marketplace-APK
          path: Maua-Marketplace.apk
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: Maua-Marketplace-AAB
          path: android/app-release-bundle.aab
          retention-days: 90
