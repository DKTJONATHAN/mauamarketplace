name: Build Maua Marketplace APK

on:
  push:
    paths:
      - "android/twa-manifest.json"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare Android SDK for Bubblewrap
        run: |
          set -e

          SDK="/usr/local/lib/android/sdk"
          CMDLINE="$SDK/cmdline-tools/latest"
          test -d "$SDK"
          test -x "$CMDLINE/bin/sdkmanager"

          echo "Using Android SDK: $SDK"
          echo "Using command-line tools: $CMDLINE"

          yes | "$CMDLINE/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$CMDLINE/bin/sdkmanager" --sdk_root="$SDK" --install             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

          BW_SDK="$RUNNER_TEMP/bubblewrap-android-sdk"
          rm -rf "$BW_SDK"
          mkdir -p "$BW_SDK"
          ln -s "$CMDLINE/bin" "$BW_SDK/bin"
          ln -s "$SDK/build-tools" "$BW_SDK/build-tools"
          ln -s "$SDK/platform-tools" "$BW_SDK/platform-tools"
          ln -s "$SDK/platforms" "$BW_SDK/platforms"
          ln -s "$SDK/licenses" "$BW_SDK/licenses" || true

          test -x "$BW_SDK/bin/sdkmanager"
          test -d "$BW_SDK/build-tools/35.0.0"
          test -d "$BW_SDK/platforms/android-35"

          echo "ANDROID_HOME=$BW_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=" >> "$GITHUB_ENV"
          echo "BUBBLEWRAP_ANDROID_SDK=$BW_SDK" >> "$GITHUB_ENV"
          echo "Bubblewrap SDK: $BW_SDK"
          find "$BW_SDK" -maxdepth 2 -type l -o -type d | head -50

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Configure Bubblewrap non-interactively
        run: |
          set -e
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$BUBBLEWRAP_ANDROID_SDK"
          }
          EOF
          cat "$HOME/.bubblewrap/config.json"
          unset ANDROID_SDK_ROOT
          export ANDROID_HOME="$BUBBLEWRAP_ANDROID_SDK"
          bubblewrap doctor

      - name: Prepare persistent signing key
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android.keystore.p12
          keytool -list             -storetype PKCS12             -keystore android.keystore.p12             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -alias "maua-marketplace" >/dev/null

          rm -f android.keystore
          keytool -importkeystore             -srckeystore android.keystore.p12             -srcstoretype PKCS12             -srcstorepass "$ANDROID_KEYSTORE_PASSWORD"             -srckeypass "$ANDROID_KEY_PASSWORD"             -srcalias "maua-marketplace"             -destkeystore android.keystore             -deststoretype JKS             -deststorepass "$ANDROID_KEYSTORE_PASSWORD"             -destkeypass "$ANDROID_KEY_PASSWORD"             -destalias "maua-marketplace"             -noprompt

          keytool -list             -keystore android.keystore             -storetype JKS             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -alias "maua-marketplace" >/dev/null

      - name: Show signing certificate SHA-256
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          echo "Persistent Android signing certificate SHA-256:"
          keytool -list -v             -keystore android.keystore             -storetype JKS             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -alias "maua-marketplace"             | grep "SHA256:"

      - name: Generate Android project
        working-directory: android
        run: |
          unset ANDROID_SDK_ROOT
          export ANDROID_HOME="$BUBBLEWRAP_ANDROID_SDK"
          bubblewrap update --skipVersionUpgrade --manifest="./twa-manifest.json"

      - name: Build signed APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          unset ANDROID_SDK_ROOT
          export ANDROID_HOME="$BUBBLEWRAP_ANDROID_SDK"
          bubblewrap build --skipPwaValidation --manifest="./twa-manifest.json" --signingKeyPath="./android.keystore" --signingKeyAlias="maua-marketplace"

      - name: Rename APK
        working-directory: android
        run: cp app-release-signed.apk ../Maua-Marketplace.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Maua-Marketplace-APK
          path: Maua-Marketplace.apk
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: Maua-Marketplace-AAB
          path: android/app-release-bundle.aab
          retention-days: 90
