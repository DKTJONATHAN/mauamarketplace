name: Supabase (database + functions)

# Run this by hand from the Actions tab after you add the secrets listed in the README.
# It applies supabase/migrations, and deploys the remaining Supabase edge functions.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Apply database migrations
        run: supabase db push
      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
